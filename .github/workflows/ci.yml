# CI workflow for the feature/1.0.x line (JDK 8)
#
# Triggers:
#   - push / pull_request on the feature/1.0.x branch
#   - manual workflow_dispatch
#
# Runs `./mvnw -B clean verify` which includes the JaCoCo coverage report
# (90% line coverage, haltOnFailure=false) configured in the POM.
name: CI

on:
  push:
    branches: [feature/1.0.x]
  pull_request:
    branches: [feature/1.0.x]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: JDK 8 Build & Verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Set up JDK 8
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '8'
          cache: maven

      - name: Verify shared contract fixtures and source lock
        working-directory: src/test/resources/opencli-contracts/v1
        run: sha256sum --strict -c SHA256SUMS

      - name: Verify pinned structured help samples
        working-directory: src/test/resources/opencli-contracts/v1/structured-help-1.8.8
        run: sha256sum --strict -c SHA256SUMS

      - name: Verify pinned browser output samples
        working-directory: src/test/resources/opencli-contracts/v1/browser-output-1.8.8
        run: sha256sum --strict -c SHA256SUMS

      - name: Build and verify with JaCoCo coverage
        run: ./mvnw -B --no-transfer-progress clean verify

      - name: Upload JaCoCo coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: jacoco-coverage
          path: target/site/jacoco
          if-no-files-found: error
          retention-days: 14

      - name: Upload surefire reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: surefire-reports
          path: target/surefire-reports
          retention-days: 14
